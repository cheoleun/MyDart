<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>재무제표 조회</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            body {
                font-family: sans-serif;
                margin: 0;
                padding: 2rem;
            }
            .container {
                max-width: 1200px;
                margin: 0 auto;
                text-align: center;
            }
            input {
                margin: 5px;
                padding: 8px;
            }
            button {
                padding: 10px 20px;
                cursor: pointer;
            }
            #result {
                margin-top: 20px;
                text-align: left;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <nav style="margin-bottom: 2rem">
                <a href="screener.html">기업 스크리너</a> |
                <a href="db_viewer.html">DB 현황 조회</a>
            </nav>
            <h1>재무제표 조회</h1>
            <div>
                <input type="text" id="companyName" placeholder="회사 이름" />
                <input type="number" id="startYear" placeholder="시작 연도" />
                <input type="number" id="endYear" placeholder="마지막 연도" />
                <select id="fsDiv" style="margin: 5px; padding: 8px">
                    <option value="CFS" selected>연결</option>
                    <option value="OFS">개별</option>
                </select>
                <button onclick="getFinancials()">조회</button>
            </div>
            <div id="result"></div>
            <div id="charts-container" style="margin-top: 40px">
                <div style="margin-bottom: 20px">
                    <canvas id="revenueChart"></canvas>
                </div>
                <div style="margin-bottom: 20px">
                    <canvas id="operatingProfitChart"></canvas>
                </div>
                <div style="margin-bottom: 20px">
                    <canvas id="netIncomeChart"></canvas>
                </div>
                <div><canvas id="epsChart"></canvas></div>
            </div>
        </div>

        <script>
            let charts = {}; // 차트 인스턴스를 저장할 객체
            async function getFinancials() {
                const companyName =
                    document.getElementById("companyName").value;
                const startYear = document.getElementById("startYear").value;
                const endYear = document.getElementById("endYear").value;
                const fsDiv = document.getElementById("fsDiv").value;
                const resultDiv = document.getElementById("result");

                resultDiv.innerHTML =
                    "데이터를 가져오는 중입니다. 잠시만 기다려주세요...";

                const response = await fetch(
                    `http://localhost:5003/api/financials?company_name=${companyName}&start_year=${startYear}&end_year=${endYear}&fs_div=${fsDiv}`
                );
                const data = await response.json();
                console.log("서버로부터 받은 데이터:", data); // 데이터 확인을 위해 콘솔에 출력

                if (data.error) {
                    resultDiv.innerHTML = `오류: ${data.error}`;
                    return;
                }

                // 기존 차트 파괴
                Object.values(charts).forEach((chart) => chart.destroy());
                charts = {};

                // 테이블 생성
                const tableData = data.table_data;
                let html = "";
                for (const year in tableData) {
                    html += `<h2>${year}년</h2>`;
                    html +=
                        '<table border="1" style="width:100%; border-collapse: collapse;"><tr><th>항목</th><th>1분기</th><th>2분기</th><th>3분기</th><th>4분기</th><th>연간</th></tr>';

                    const yearData = tableData[year];

                    function formatNumber(num, growth) {
                        if (num === null || num === undefined) return "N/A";

                        let growthStr = "";
                        if (growth !== null && growth !== undefined) {
                            const color = growth > 0 ? "blue" : "red";
                            growthStr = ` <span style="color:${color};">(${
                                growth > 0 ? "+" : ""
                            }${growth.toFixed(1)}%)</span>`;
                        }
                        return `${num.toLocaleString()}${growthStr}`;
                    }

                    function generateRow(title, metric) {
                        let rowHtml = `<tr><td>${title}</td>`;
                        for (const quarter of [
                            "Q1",
                            "Q2",
                            "Q3",
                            "Q4",
                            "Annual",
                        ]) {
                            const value = yearData[quarter]
                                ? yearData[quarter][metric]
                                : null;
                            const growth = yearData[quarter]
                                ? yearData[quarter][`${metric}_growth`]
                                : null;
                            rowHtml += `<td>${formatNumber(
                                value,
                                growth
                            )}</td>`;
                        }
                        rowHtml += `</tr>`;
                        return rowHtml;
                    }

                    html += generateRow("매출액", "revenue");
                    html += generateRow("영업이익", "operating_profit");
                    html += generateRow("당기순이익", "net_income");
                    html += generateRow("EPS (원)", "eps");

                    // 총 주식수는 성장률 없이 표시
                    let sharesRow = `<tr><td>총 주식수</td>`;
                    for (const quarter of ["Q1", "Q2", "Q3", "Q4", "Annual"]) {
                        const value = yearData[quarter]
                            ? yearData[quarter]["total_shares"]
                            : null;
                        sharesRow += `<td>${
                            value !== null && value !== undefined
                                ? value.toLocaleString()
                                : "N/A"
                        }</td>`;
                    }
                    sharesRow += `</tr>`;
                    html += sharesRow;

                    html += "</table>";
                }
                resultDiv.innerHTML = html;

                // 차트 생성
                const chartData = data.chart_data;
                if (chartData) {
                    createChart(
                        "revenueChart",
                        "매출액 (TTM)",
                        chartData.revenue
                    );
                    createChart(
                        "operatingProfitChart",
                        "영업이익 (TTM)",
                        chartData.operating_profit
                    );
                    createChart(
                        "netIncomeChart",
                        "당기순이익 (TTM)",
                        chartData.net_income
                    );
                    createChart("epsChart", "EPS (TTM)", chartData.eps);
                }
            }

            function createChart(canvasId, label, data) {
                const ctx = document.getElementById(canvasId).getContext("2d");
                charts[canvasId] = new Chart(ctx, {
                    type: "bar",
                    data: {
                        datasets: [
                            {
                                label: label,
                                data: data,
                                backgroundColor: "rgba(75, 192, 192, 0.6)",
                                borderColor: "rgba(75, 192, 192, 1)",
                                borderWidth: 1,
                            },
                        ],
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: function (value, index, values) {
                                        return value.toLocaleString();
                                    },
                                },
                            },
                        },
                    },
                });
            }
        </script>
    </body>
</html>
